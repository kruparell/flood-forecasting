# ==============================================================================
# GoogleHydrology Tutorial Configuration File (AR-LSTM Local Version)
# ==============================================================================

# --- 1. General Experiment Settings -------------------------------------------
experiment_name: arlstm-local-example
run_dir: /usr/local/google/home/kruparell/flood-forecasting/tutorial/model-runs/
logging_level: INFO
detect_anomaly: False
print_warnings_once: False

# --- 2. Data Configuration ----------------------------------------------------
dataset: multimet

# File Paths
train_basin_file: /usr/local/google/home/kruparell/flood-forecasting/tutorial/basin-lists/5-basin-train.txt
validation_basin_file: /usr/local/google/home/kruparell/flood-forecasting/tutorial/basin-lists/5-basin-train.txt
test_basin_file: /usr/local/google/home/kruparell/flood-forecasting/tutorial/basin-lists/8-basin-test.txt

targets_data_dir: /usr/local/google/home/kruparell/flood-forecasting/tutorial/Caravan-nc
statics_data_dir: /usr/local/google/home/kruparell/flood-forecasting/tutorial/Caravan-nc
dynamics_data_dir: /usr/local/google/home/kruparell/Caravans_MultiMet

load_as_csv: False

# -- Time Periods --
train_start_date: 01/01/2000
train_end_date: 31/12/2010
validation_start_date: 01/01/2011
validation_end_date: 31/12/2012
test_start_date: 01/01/2011
test_end_date: 31/12/2012

# -- Input Features (Dynamic) --
hindcast_inputs:
  hres:
    - hres_temperature_2m
    - hres_total_precipitation
  imerg:
    - imerg_precipitation
  cpc:
    - cpc_precipitation

# NO forecast inputs for simulation mode
forecast_inputs: {}

# Autoregressive inputs
autoregressive_inputs:
  - streamflow_shift1

# dynamic_inputs (do not include AR inputs here, they are added automatically)
dynamic_inputs:
  - hres_temperature_2m
  - hres_total_precipitation
  - imerg_precipitation
  - cpc_precipitation

# -- Union Mapping --
union_mapping:
  cpc_precipitation: era5land_total_precipitation
  imerg_precipitation: era5land_total_precipitation
  hres_temperature_2m: era5land_temperature_2m
  hres_total_precipitation: era5land_total_precipitation

# -- Input Features (Static) --
static_attributes:
  - area
  - aridity_ERA5_LAND
  - frac_snow
  - p_mean
  - pet_mean_ERA5_LAND

# -- Targets --
target_variables:
  - streamflow

# --- 3. Model Architecture ----------------------------------------------------
model: arlstm
hidden_size: 16
head: regression
output_activation: linear
seq_length: 365
timestep_counter: True

# -- Dropout --
output_dropout: 0.0

# -- Initialization --
initial_forget_bias: 3
weight_init_opts:
  - lstm-ih-xavier
  - lstm-hh-orthogonal
  - fc-xavier

# -- Sub-network Configurations --
statics_embedding:
  type: fc
  hiddens: [20]
  activation: [linear]
  dropout: 0.0

dynamics_embedding:
  type: fc
  hiddens: [20]
  activation: [linear]
  dropout: 0.0

# --- 4. Training Configuration ------------------------------------------------
device: cpu
seed: 42
loss: MSE
optimizer: Adam

epochs: 5
batch_size: 256
max_updates_per_epoch: 100

# -- Learning Rate Scheduler --
learning_rate_strategy: StepLR
initial_learning_rate: 0.01
learning_rate_drop_factor: 0.5
learning_rate_epochs_drop: 2

# -- Regularization & Stability --
clip_gradient_norm: 1
target_noise_std: 0.005

# --- 5. Validation & Evaluation -----------------------------------------------
metrics:
  - NSE

validate_every: 1
validate_n_random_basins: -1
tester_skip_obs_all_nan: True
tester_sample_reduction: median

predict_last_n: 1
lead_time: 7
allzero_samples_are_invalid: False

# --- 6. System & Runtime ------------------------------------------------------
num_workers: 0
log_loss_every_nth_update: 10
log_n_figures: 0
cache:
  enabled: False
