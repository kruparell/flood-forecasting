# ==============================================================================
# GoogleHydrology Tutorial Configuration File (Local Data Version)
# ==============================================================================

# --- 1. General Experiment Settings -------------------------------------------
experiment_name: 5-basin-local-example
run_dir: /usr/local/google/home/kruparell/flood-forecasting/tutorial/model-runs/
logging_level: INFO
detect_anomaly: False
print_warnings_once: False

# --- 2. Data Configuration ----------------------------------------------------
dataset: multimet

# File Paths (Modified for local run)
train_basin_file: /usr/local/google/home/kruparell/flood-forecasting/tutorial/basin-lists/5-basin-train.txt
validation_basin_file: /usr/local/google/home/kruparell/flood-forecasting/tutorial/basin-lists/5-basin-train.txt
test_basin_file: /usr/local/google/home/kruparell/flood-forecasting/tutorial/basin-lists/8-basin-test.txt

targets_data_dir: /usr/local/google/home/kruparell/flood-forecasting/tutorial/Caravan-nc
statics_data_dir: /usr/local/google/home/kruparell/flood-forecasting/tutorial/Caravan-nc
dynamics_data_dir: /usr/local/google/home/kruparell/Caravans_MultiMet

load_as_csv: False

# -- Time Periods --
train_start_date: 01/01/2000
train_end_date: 31/12/2020
validation_start_date: 01/01/2022
validation_end_date: 31/12/2024
test_start_date: 01/01/2022
test_end_date: 31/12/2024

# -- Input Features (Dynamic) --
hindcast_inputs:
  hres:
    - hres_temperature_2m
    - hres_total_precipitation
  imerg:
    - imerg_precipitation
  cpc:
    - cpc_precipitation

forecast_inputs:
  hres:
    - hres_temperature_2m
    - hres_total_precipitation
  graphcast:
    - graphcast_temperature_2m
    - graphcast_total_precipitation

# -- Union Mapping --
union_mapping:
  cpc_precipitation: era5land_total_precipitation
  imerg_precipitation: era5land_total_precipitation
  graphcast_temperature_2m: era5land_temperature_2m
  graphcast_total_precipitation: era5land_total_precipitation
  hres_temperature_2m: era5land_temperature_2m
  hres_total_precipitation: era5land_total_precipitation

# -- Input Features (Static) --
static_attributes:
- area
- aridity_ERA5_LAND
- aridity_FAO_PM
- frac_snow
- moisture_index_ERA5_LAND
- moisture_index_FAO_PM
- p_mean
- pet_mean_ERA5_LAND
- pet_mean_FAO_PM

# -- Targets --
target_variables:
- streamflow

# --- 3. Model Architecture ----------------------------------------------------
model: mean_embedding_forecast_lstm
hidden_size: 16
head: regression
output_activation: linear
seq_length: 365
lead_time: 7
forecast_overlap: 365
timestep_counter: True

# -- Dropout --
output_dropout: 0.4

# -- Initialization --
initial_forget_bias: 3
weight_init_opts:
- lstm-ih-xavier
- lstm-hh-orthogonal
- fc-xavier

# -- Sub-network Configurations --
statics_embedding:
  type: fc
  hiddens: [100, 100, 20]
  activation: [tanh, tanh, linear]
  dropout: 0.0
hindcast_embedding:
  type: fc
  hiddens: [100, 20]
  activation: [tanh, linear]
  dropout: 0.0
forecast_embedding:
  type: fc
  hiddens: [20, 20, 20, 20]
  activation: [tanh, tanh, tanh, linear]
  dropout: 0.0

# --- 4. Training Configuration ------------------------------------------------
device: cpu # Set to CPU for local testing
seed: 42
loss: MSE
optimizer: Adam

# Modified for quick run
epochs: 2
batch_size: 256
max_updates_per_epoch: -1

# -- Learning Rate Scheduler --
learning_rate_strategy: StepLR
initial_learning_rate: 0.001
learning_rate_drop_factor: 0.5
learning_rate_epochs_drop: 3

# -- Regularization & Stability --
clip_gradient_norm: 1
target_noise_std: 0.005

# --- 5. Validation & Evaluation -----------------------------------------------
metrics:
- NSE
- KGE

validate_every: 1
validate_n_random_basins: -1
tester_skip_obs_all_nan: True
tester_sample_reduction: median

clip_targets_to_zero:
- streamflow

predict_last_n: 8
allzero_samples_are_invalid: False

# --- 6. System & Runtime ------------------------------------------------------
num_workers: 2
log_loss_every_nth_update: 50
log_n_figures: 0

cache:
  enabled: True
  byte_limit: 10000000000
