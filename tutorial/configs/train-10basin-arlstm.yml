# -- Targets --
target_variables:
  - streamflow

# --- 3. Model Architecture ----------------------------------------------------
model: arlstm
hidden_size: 16
head: regression
output_activation: linear
seq_length: 180
timestep_counter: True

# -- Dropout --
output_dropout: 0.0

# Mask 99% of AR observations during training (model receives ground truth 1% of the time)
random_holdout_from_dynamic_features:
  streamflow_shift1:
    missing_fraction: 0.99
    mean_missing_length: 10

# -- Initialization --
initial_forget_bias: 3
weight_init_opts:
  - lstm-ih-xavier
  - lstm-hh-orthogonal
  - fc-xavier

# -- Sub-network Configurations --
statics_embedding:
  type: fc
  hiddens: [20]
  activation: linear
  dropout: 0.0

dynamics_embedding:
  type: fc
  hiddens: [20]
  activation: linear
  dropout: 0.0

# --- 4. Training Configuration ------------------------------------------------
device: cpu
seed: 42
loss: MSE
optimizer: Adam

epochs: 2
batch_size: 16
max_updates_per_epoch: 25
save_weights_every: 1

# -- Learning Rate Scheduler --
learning_rate: 0.02
learning_rate_strategy: StepLR
initial_learning_rate: 0.02
learning_rate_drop_factor: 0.8
learning_rate_epochs_drop: 2

# -- Regularization & Stability --
clip_gradient_norm: 1
target_noise_std: 0.0

# --- 5. Validation & Evaluation -----------------------------------------------
metrics:
  - NSE

validate_every: 0
validate_n_random_basins: -1
tester_skip_obs_all_nan: True
tester_sample_reduction: median

predict_last_n: 7
lead_time: 7
allzero_samples_are_invalid: False

# --- 6. System & Runtime ------------------------------------------------------
num_workers: 0
log_loss_every_nth_update: 10
log_n_figures: 0
cache:
  enabled: False
